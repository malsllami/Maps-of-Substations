<!-- index.html — الصفحة الرئيسية: تجمع المكوّنات فقط (الربط في pages/home.js، لا منطق أعمال هنا)
     إعادة التصميم (19 أكتوبر): ثلاث شاشات داخل الصفحة يتنقل بينها الشريط السفلي بلا إعادة تحميل —
     «الرئيسية» (البحث والإجراءات والإحصاءات)، «الخريطة» (شريط البحث الصغير والبطاقة والخريطة)، «المحطات».
     الكرة أُزيلت من هنا (تنتقل لصفحة الدخول).
     The home page: assembles components only. Redesign (19 Oct): three in-page screens switched by the bottom bar with
     no reload — home, map, stations. The globe moved out of here (to the login page). -->

<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1826">
<!-- هذه الصفحة وحدها تمتد خلف شريط الساعة في التطبيق المثبّت: الخريطة والملاحة تظهران خلفه، وبقية شاشاتها تُنزل رأسها بالمنطقة
     الآمنة، والصفحة بطول الشاشة الكاملة 100lvh حتى لا يظهر فراغ سفلي (home.css). الصفحات الأخرى بلا امتداد.
     This page alone extends behind the status bar in the installed app: the map and navigation show behind it, its other
     screens push their header down by the safe area, and the page is the full 100lvh so no bottom gap shows. Other pages don't extend. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-title" content="D.S.Maps">

<body class="home-page" data-view="map">

<header id="appHeader"></header>

<!-- صفحة الزائر كما في الموقع الحي (طلب محمد 19 أكتوبر): الكرة وفوقها العنوان وتحتها «تسجيل الدخول» — تظهر للزائر وحده
     The guest page as on the live site: the globe, the heading above, «login» below — guests only -->
<section class="guest-landing" id="guestLanding" hidden>
  <div class="globe-stage" id="globeStage"></div>
  <div class="guest-hero">
    <div class="eyebrow">SEC // DISTRIBUTION NETWORK</div>
    <h1 class="guest-title">ابحث عن محطات التوزيع والتحويل</h1>
    <a href="auth.html" class="guest-login-cta globe-bottom-anchor">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      تسجيل الدخول
    </a>
  </div>
</section>

<main class="app-views">
<!-- شاشة «الرئيسية» — the home screen -->
<section class="app-view view-home" id="viewHome">
  <!-- البحث أولًا: عنوان واضح وحقل ظاهر دائمًا (ملاحظة محمد: لا لبس في زر دائري) — search first: a clear title and an always-visible field -->
  <div class="hero-content" id="heroContent">
    <div class="home-date" id="homeDate"></div>
    <h1 class="home-title">ابحث عن محطات التوزيع والتحويل</h1>
    <div class="search-wrap">
      <div id="lensBox"></div>
    </div>
  </div>

  <section class="cards-section" id="cardsSection">
    <!-- أرقام المحطات (توزيع، تحويل، الإجمالي، عمليات اليوم) — the station numbers -->
    <div class="home-slot" id="statsSlot"></div>
    <!-- إجراءات سريعة: الأعطال، آخر المحطات، تحديث الأرقام («إضافة محطة» صار زر ＋ في الشريط السفلي)
         Quick actions: outage, recent, refresh numbers («add station» is now the ＋ in the bottom bar) -->
    <div class="action-tiles">
      <button type="button" class="action-tile tile-outage" id="outageTileBtn" aria-controls="homeOutage">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="tile-label">الأعطال</span><span class="tile-sub">عدة محطات</span>
      </button>
      <button type="button" class="action-tile tile-recent" id="recentToggleBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="tile-label">آخر المحطات</span><span class="tile-sub">آخر ساعتين</span>
      </button>
      <button type="button" class="action-tile tile-refresh" id="refreshStatsBtn" aria-label="تحديث أرقام لوحة المعلومات" aria-describedby="refreshNote" title="يحدّث أرقام لوحة المعلومات فقط — لبيانات المحطات استخدم زر التحديث في الشريط العلوي">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="tile-label">تحديث</span><span class="tile-sub">الأرقام</span>
      </button>
    </div>
    <!-- رسالة زر «تحديث»: ماذا يحدّث، ونتيجته (طلب محمد، 15 أكتوبر) — the refresh tile's note -->
    <div class="action-note" id="refreshNote" role="status" hidden></div>
    <div class="home-slot" id="homeOutage"></div>
    <div class="home-slot" id="recentSlot"></div>
    <!-- البيانات المؤقتة أسفل شاشة «البيانات» (محمد 22 أكتوبر: نُقلت من «المزيد») — the cached data at the bottom of the data screen -->
    <div class="storage-screen data-storage">
      <div class="sync-line" id="storageSyncLine" role="status"></div>
      <div class="home-slot" id="storageSlot"></div>
    </div>
  </section>
</section>

<!-- الرئيسية = الخريطة بكامل الصفحة (20 أكتوبر): البحث عائم أعلاها، وبطاقة المحطة أسفلها، وشاشة «تحديد موقعك» عند الدخول
     Home = the full-page map: the floating search above, the station card below, and the «locate yourself» screen on entry -->
<section class="hero app-view view-map" id="heroSection">
  <div class="top-content-area" id="topContentArea">
    <div id="barBox"></div>
    <!-- حالة نسخة المحطات في الرئيسية (بلا شريط علوي): تظهر بنقطة البحث أو وحدها حين لا تكون خضراء — the copy status on home -->
    <div class="map-status" id="mapStatus" role="status" hidden><span data-role="map-status-text"></span><button type="button" class="map-status-btn" data-act="map-refresh" aria-label="تحديث نسخة المحطات">⟳ تحديث</button></div>
  </div>
  <div class="map-stage-slot"><div id="mapStage"></div></div>
  <div class="station-table station-sheet" id="stationTable"></div>
</section>

<!-- شاشة «تفاصيل المحطة» (تُفتح من لوحة المحطة) — the station details screen (opened from the station sheet) -->
<section class="app-view view-details" id="viewDetails"><div id="detailsBox"></div></section>

<!-- شاشة «المزيد» (المرحلة ز) — the «More» screen -->
<section class="app-view view-more" id="viewMore"><div id="moreBox"></div></section>

<!-- شاشة «المحطات» — the stations screen -->
<section class="app-view view-stations" id="viewStations"><div id="stationsBox"></div></section>
</main>
