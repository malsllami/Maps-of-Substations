<!doctype html>
<!-- index.html — الصفحة الرئيسية في V2: تجمع المكوّنات فقط بترتيب V1 وشكله (الربط في pages/home.js، لا منطق أعمال هنا)
     الشاشة الافتتاحية، الرأس وشريط الاتصال، القسم العلوي (العنوان، العدسة، بحث الأعطال، زر دخول الزائر) فوق الكرة،
     منطقة المحطة (شريط البحث الصغير، البطاقة، الخريطة)، ثم أزرار الإجراءات وآخر المحطات والإحصاءات وقسم الذاكرة والتذييل.
     The V2 home page: assembles components only, in V1's order and look (wiring in pages/home.js, no business logic here). -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محطات التوزيع | الشركة السعودية للطاقة</title>
<script src="config/الإعدادات.js"></script>
<script src="services/theme.js"></script>
<!-- تطبيق قابل للتثبيت: الملف والأيقونة ولون الشريط، وتسجيل عامل الخدمة بعد التحميل — installable app: manifest, icon, bar colour, SW registered after load -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1826">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script src="services/pwa.js"></script>
<link rel="stylesheet" href="styles/update-sheet.css">
<script src="components/update-sheet.js"></script>
<link rel="stylesheet" href="styles/install-sheet.css">
<script src="components/install-sheet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<link rel="stylesheet" href="styles/app-header.css">

<link rel="stylesheet" href="styles/offline-map.css">
<link rel="stylesheet" href="styles/add-edit-station.css">
<link rel="stylesheet" href="styles/delete-station.css">
<link rel="stylesheet" href="styles/recent-stations.css">
<link rel="stylesheet" href="styles/tables.css">

<link rel="stylesheet" href="styles/profile-gate.css">
<link rel="stylesheet" href="styles/home.css">

<body class="home-page">

<!-- الشاشة الافتتاحية حتى تجهز الكرة — the intro until the globe is ready -->
<div id="introOverlay">
  <img class="intro-logo" src="assets/logo-icon.png" alt="شعار الشركة السعودية للطاقة">
  <div class="intro-text">محطات التوزيع الكهربائية</div>
</div>

<header id="appHeader"></header>

<section class="hero" id="heroSection">
  <!-- منطقة المحطة: شريط البحث الصغير والبطاقة، ثم الخريطة خارجها (الملاحة تطوي المنطقة وتبقي الخريطة كما في V1)
       The station area: the small search bar and the card, then the map outside it (navigation folds the area, keeps the map, as V1) -->
  <div class="top-content-area" id="topContentArea">
    <div id="barBox"></div>
    <div class="station-table" id="stationTable"></div>
  </div>
  <div class="map-stage-slot"><div id="mapStage"></div></div>

  <div class="globe-stage" id="globeStage"></div>

  <div class="hero-content" id="heroContent">
    <div class="hero-heading">
      <div class="eyebrow">SEC // DISTRIBUTION NETWORK</div>
      <h1>ابحث عن محطات التوزيع والتحويل</h1>
    </div>
    <div class="search-wrap globe-bottom-anchor">
      <div id="lensBox"></div>
    </div>
    <a href="auth.html" class="guest-login-cta globe-bottom-anchor">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      تسجيل الدخول
    </a>
  </div>
</section>

<section class="cards-section" id="cardsSection">
  <!-- أزرار الإجراءات (تصميم محمد، 15 أكتوبر): «إضافة محطة» بعرض الشاشة، ثم ثلاث بطاقات بأيقونات — الأعطال أصفر، آخر المحطات أزرق، التحديث محايد
       Action buttons (Mohammed's design, 15 Oct): a full-width «add station», then three icon tiles -->
  <button type="button" class="action-add" id="addStationToggle">
    <span class="action-add-plus" aria-hidden="true">+</span>
    <span class="action-add-label">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      إضافة محطة
    </span>
  </button>
  <div class="action-tiles">
    <button type="button" class="action-tile tile-outage" id="outageTileBtn" aria-controls="homeOutage">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="tile-label">الأعطال</span><span class="tile-sub">بحث (أكثر من محطة)</span>
    </button>
    <button type="button" class="action-tile tile-recent" id="recentToggleBtn">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="tile-label">آخر المحطات</span>
    </button>
    <button type="button" class="action-tile tile-refresh" id="refreshStatsBtn" aria-label="تحديث أرقام لوحة المعلومات" aria-describedby="refreshNote" title="يحدّث أرقام لوحة المعلومات فقط — لبيانات المحطات استخدم زر التحديث في الشريط العلوي">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span class="tile-label">تحديث</span>
    </button>
  </div>
  <!-- رسالة زر «تحديث»: ماذا يحدّث، ونتيجته (طلب محمد، 15 أكتوبر) — the refresh tile's note: what it refreshes, and the result -->
  <div class="action-note" id="refreshNote" role="status" hidden></div>
  <div class="home-slot" id="homeOutage"></div>
  <div class="home-slot" id="recentSlot"></div>
  <div class="home-slot" id="statsSlot"></div>
  <div class="home-slot" id="storageSlot"></div>
</section>

<footer class="home-footer">© 2026 الشركة السعودية للطاقة — جميع الحقوق محفوظة</footer>

<script src="components/add-edit-station.js"></script>
<script src="components/delete-station.js"></script>
<script src="components/recent-stations.js"></script>

</body>
